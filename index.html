.region-nw{--c:#16a34a;--softc:#f0fdf4}
.region-central{--c:#ca8a04;--softc:#fefce8}
.region-midSouth{--c:#ea580c;--softc:#fff7ed}
.region-east{--c:#92400e;--softc:#fffbeb}

<div class="wrap">
<header class="header">

  <p>全島資料庫｜餐廳・咖啡・麵包・甜點・小吃・夜市・海鮮</p>

<section id="myCard" class="card">

    <button class="danger" onclick="clearMine()">清空目前勾選</button>
    <span id="saveStatus" class="small"></span>
  </div>
</section>

<div class="toolbar">
  <div class="row" id="regionBar">
    <span class="label">區域</span>
    <button class="region-btn region-all selected" data-value="全部">全部</button>
    <button class="region-btn region-north selected" data-value="北島">北島</button>
    <button class="region-btn region-nw selected" data-value="西北">西北／Ông Lang 翁朗</button>
    <button class="region-btn region-central selected" data-value="中島">中島／Dương Đông 楊東</button>
    <button class="region-btn region-midSouth selected" data-value="中南">中南／Long Beach 長灘</button>
    <button class="region-btn region-east selected" data-value="東島">東島／Hàm Ninh 咸寧</button>
    <button class="region-btn region-south selected" data-value="南島">南島／An Thới 安泰</button>
  </div>
  <div class="row">
    <span class="label">類型</span>
    <select id="typeFilter"><option value="全部">全部類型</option></select>
    <span class="label">必吃</span>
    <select id="tierFilter">
      <option value="全部">全部</option><option value="S">只看 S</option><option value="A">只看 A</option><option value="B">只看 B</option>
    </select>
    <span class="label">Google</span>
    <select id="ratingFilter">
      <option value="全部">全部</option><option value="4.8">4.8★以上</option><option value="4.7">4.7★以上</option><option value="4.5">4.5★以上</option><option value="verified">已有評分</option><option value="none">查無評論</option>
    </select>
    <input id="search" type="text" placeholder="搜尋店名、中文名、料理、區域…">
    <button onclick="resetFilters()">重設篩選</button>
  </div>
  <div class="row small">
    <span>必吃等級：S＝優先鎖定　A＝很值得　B＝備選。已刪除 ABC 分級，避免重複。</span>
    <span style="margin-left:auto">字體 <button onclick="fontStep(-.1)">A−</button> <b id="fontPct">100%</b> <button onclick="fontStep(.1)">A＋</button></span>
  </div>
</div>

<main id="sections"></main>
<footer class="footer">研究版 1.1｜更新日期 2026-09-05｜Google 星等與評論數會持續變動。</footer>
</div>

const STORE_PREFIX = "phuQuocFoodListV1:";
const PROFILE_KEY = "phuQuocFoodListV1:lastProfile";
const FONT_KEY = "phuQuocFoodListV1:fontScale";
let chosen = new Set();
let activeRegion = "全部";

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function googleUrl(x){return "https://www.google.com/search?q="+encodeURIComponent(x.name+" 富國島")}
function ratingText(x){
  if(x.rating==null) return '<span class="no-review">查無評論</span>';
  const r=x.reviews!=null ? `・${Number(x.reviews).toLocaleString()}則` : "";
  return `<span class="rating"><strong>${Number(x.rating).toFixed(1)}★</strong>${r}</span>`;
}
function rowHtml(x){
return `<tr class="${chosen.has(x.id)?"chosen":""}" data-id="${x.id}">
<td class="center"><input type="checkbox" ${chosen.has(x.id)?"checked":""} onchange="toggleItem(${x.id},this.checked)"></td>
<td class="center">${x.id}</td>
<td>${esc(x.area)}</td>
<td><span class="name">${esc(x.name)}</span><span class="zh">${esc(x.zh)}</span></td>
<td class="center tier tier-${x.tier}">${x.tier}</td>
<td>${ratingText(x)}</td>
<td><a class="google" target="_blank" rel="noopener" href="${googleUrl(x)}">Google 搜尋</a></td>
<td>${esc(x.type)}</td>
<td>${esc(x.time)}</td>
<td class="note">${esc(x.note)}</td>
</tr>`;
}
function tableHtml(arr){
 return `<div class="table-wrap"><table>
 <thead><tr><th>勾選</th><th>項次</th><th>區域</th><th>店家（原文＋中文）</th><th>必吃</th><th>Google</th><th>查看介紹</th><th>美食種類</th><th>適合時間</th><th>備註</th></tr></thead>
 <tbody>${arr.map(rowHtml).join("")}</tbody></table></div>`;
}
function currentFiltered(){
 const t=document.getElementById("typeFilter").value;
 const tier=document.getElementById("tierFilter").value;
 const rf=document.getElementById("ratingFilter").value;
 const q=document.getElementById("search").value.trim().toLowerCase();
 return DATA.filter(x=>{
   if(activeRegion!=="全部" && x.region!==activeRegion) return false;
   if(t!=="全部" && !x.type.includes(t)) return false;
   if(tier!=="全部" && x.tier!==tier) return false;
   if(rf==="verified" && x.rating==null) return false;
   if(rf==="none" && x.rating!=null) return false;
   if(!["全部","verified","none"].includes(rf) && (x.rating==null || x.rating<Number(rf))) return false;
   if(q){
     const hay=[x.region,x.area,x.name,x.zh,x.type,x.note,x.tier].join(" ").toLowerCase();
     if(!hay.includes(q)) return false;
   }
   return true;
 });
}
function render(){
 const filtered=currentFiltered();
 document.getElementById("sections").innerHTML=REGIONS.map(r=>{
   const arr=filtered.filter(x=>x.region===r); if(!arr.length) return "";
   return `<section class="section ${REGION_CLASS[r]}"><h2>${regionLabel(r)} <span class="count">${arr.length} 家</span></h2>${tableHtml(arr)}</section>`;
 }).join("") || '<div class="card" style="padding:20px;margin-top:15px">沒有符合目前篩選條件的項目。</div>';
 renderMine(); updateRegionButtons();
}
function regionLabel(r){
 return ({"北島":"北島｜Grand World 富國大世界・Gành Dầu 甘油角","西北":"西北｜Ông Lang 翁朗","中島":"中島｜Dương Đông 楊東","中南":"中南｜Long Beach 長灘・Cửa Lấp 庫阿拉普","東島":"東島｜Hàm Ninh 咸寧","南島":"南島｜An Thới 安泰・Sunset Town 日落小鎮"})[r]||r;
}
function toggleItem(id,on){on?chosen.add(id):chosen.delete(id);render();}
function renderMine(){
 const arr=DATA.filter(x=>chosen.has(x.id));
 document.getElementById("myCount").textContent=`${arr.length} 家`;
 document.getElementById("myList").innerHTML=arr.length
   ? `<div class="my-table-title">已勾選項目</div>${tableHtml(arr)}`
   : '<div class="empty">尚未勾選。從下方清單勾選後，會立即置頂顯示在這裡。</div>';
}
function updateRegionButtons(){
 document.querySelectorAll(".region-btn").forEach(b=>{
   const v=b.dataset.value;
   b.classList.toggle("selected", activeRegion==="全部" || v===activeRegion || (v==="全部" && activeRegion==="全部"));
 });
}
document.querySelectorAll(".region-btn").forEach(b=>b.addEventListener("click",()=>{activeRegion=b.dataset.value;render();}));

function profile(){return document.getElementById("profileName").value.trim()}
function keyForProfile(p){return STORE_PREFIX+p}
function setStatus(s){document.getElementById("saveStatus").textContent=s}
function saveMine(){
 const p=profile(); if(!p){setStatus("請先輸入使用者名稱。");return}
 localStorage.setItem(keyForProfile(p),JSON.stringify([...chosen])); localStorage.setItem(PROFILE_KEY,p);
 setStatus(`已儲存「${p}」的 ${chosen.size} 家。`);
}
function loadMine(){
 const p=profile(); if(!p){setStatus("請先輸入使用者名稱。");return}
 const raw=localStorage.getItem(keyForProfile(p)); chosen=new Set(raw?JSON.parse(raw):[]); localStorage.setItem(PROFILE_KEY,p);
 setStatus(raw?`已讀取「${p}」的清單。`:`「${p}」目前沒有已儲存清單。`); render();
}
function clearMine(){chosen.clear();render();setStatus("目前勾選已清空；尚未覆寫已儲存版本。")}
function copyMine(){
 const arr=DATA.filter(x=>chosen.has(x.id)); if(!arr.length){setStatus("目前沒有勾選內容。");return}
 const p=profile()||"我的";
 const txt=`🍴 富國島美食清單｜${p}\n`+arr.map((x,i)=>`${i+1}. ${x.zh}｜${x.name}\n   ${x.area}｜${x.type}｜必吃${x.tier}｜${x.rating!=null?"Google "+Number(x.rating).toFixed(1)+"★":"查無評論"}`).join("\n");
 navigator.clipboard.writeText(txt).then(()=>setStatus("已複製，可貼到 LINE。")).catch(()=>setStatus("瀏覽器無法自動複製，請手動選取。"));
}
function resetFilters(){
 activeRegion="全部";document.getElementById("typeFilter").value="全部";document.getElementById("tierFilter").value="全部";document.getElementById("ratingFilter").value="全部";document.getElementById("search").value="";render();
}
["typeFilter","tierFilter","ratingFilter"].forEach(id=>document.getElementById(id).addEventListener("change",render));
document.getElementById("search").addEventListener("input",render);

const typeRoots=[...new Set(DATA.flatMap(x=>x.type.split("／")))].sort((a,b)=>a.localeCompare(b,"zh-Hant"));
const typeSel=document.getElementById("typeFilter");typeRoots.forEach(t=>{const o=document.createElement("option");o.value=t;o.textContent=t;typeSel.appendChild(o)});

let fs=Number(localStorage.getItem(FONT_KEY)||1);
function applyFont(){fs=Math.min(1.3,Math.max(.8,fs));document.documentElement.style.setProperty("--scale",fs);document.getElementById("fontPct").textContent=Math.round(fs*100)+"%";localStorage.setItem(FONT_KEY,fs)}
function fontStep(d){fs=Math.round((fs+d)*10)/10;applyFont()} applyFont();

const last=localStorage.getItem(PROFILE_KEY);
if(last){document.getElementById("profileName").value=last;const raw=localStorage.getItem(keyForProfile(last));if(raw)chosen=new Set(JSON.parse(raw));}
render();
</script>
</body>
</html>
